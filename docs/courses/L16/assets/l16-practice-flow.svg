<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="890" viewBox="0 0 1400 890"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#35556f"/></marker><style>.title{font:700 26px Microsoft YaHei,PingFang SC,sans-serif;fill:#fff}.step{font:700 18px Microsoft YaHei,PingFang SC,sans-serif;fill:#17324d}.meta{font:15px Microsoft YaHei,PingFang SC,sans-serif;fill:#3f5567}.edge{fill:none;stroke:#35556f;stroke-width:3;marker-end:url(#arrow)}</style></defs><rect width="1400" height="890" fill="#ffffff"/><rect x="40" y="30" width="1320" height="70" rx="16" fill="#17324d"/><text x="700" y="74" text-anchor="middle" class="title">L16 实践路线：按顺序操作，每一步都留下实际结果</text><rect x="170" y="140" width="410" height="120" rx="14" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="375" y="174" text-anchor="middle" class="step">1 冻结实际起点</text><text x="375" y="208" text-anchor="middle" class="meta">位置：原源码</text><text x="375" y="236" text-anchor="middle" class="meta">产出：版本与环境</text><rect x="820" y="140" width="410" height="120" rx="14" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="1025" y="174" text-anchor="middle" class="step">2 由同伴冷启动</text><text x="1025" y="208" text-anchor="middle" class="meta">位置：全新环境</text><text x="1025" y="236" text-anchor="middle" class="meta">产出：首次失败与修订</text><rect x="170" y="320" width="410" height="120" rx="14" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="375" y="354" text-anchor="middle" class="step">3 抽取未实现需求</text><text x="375" y="388" text-anchor="middle" class="meta">位置：工作台 + 你</text><text x="375" y="416" text-anchor="middle" class="meta">产出：受控 Spec</text><rect x="820" y="320" width="410" height="120" rx="14" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="1025" y="354" text-anchor="middle" class="step">4 交付并复验</text><text x="1025" y="388" text-anchor="middle" class="meta">位置：隔离候选</text><text x="1025" y="416" text-anchor="middle" class="meta">产出：真实 Diff 与 Eval</text><rect x="170" y="500" width="410" height="120" rx="14" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="375" y="534" text-anchor="middle" class="step">5 检查治理入口</text><text x="375" y="568" text-anchor="middle" class="meta">位置：工作台</text><text x="375" y="596" text-anchor="middle" class="meta">产出：任务与审核</text><rect x="820" y="500" width="410" height="120" rx="14" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="1025" y="534" text-anchor="middle" class="step">6 恢复、导出与反馈</text><text x="1025" y="568" text-anchor="middle" class="meta">位置：双系统</text><text x="1025" y="596" text-anchor="middle" class="meta">产出：交付索引</text><rect x="170" y="680" width="410" height="120" rx="14" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="375" y="714" text-anchor="middle" class="step">7 答辩与迁移</text><text x="375" y="748" text-anchor="middle" class="meta">位置：你 + 复验者</text><text x="375" y="776" text-anchor="middle" class="meta">产出：最终接受</text><path class="edge" d="M580 200 H810"/><path class="edge" d="M1025 260 V290 H375 V310"/><path class="edge" d="M580 380 H810"/><path class="edge" d="M1025 440 V470 H375 V490"/><path class="edge" d="M580 560 H810"/><path class="edge" d="M1025 620 V650 H375 V670"/></svg>
