<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="890" viewBox="0 0 1400 890"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#35556f"/></marker><style>.title{font:700 26px Microsoft YaHei,PingFang SC,sans-serif;fill:#fff}.step{font:700 18px Microsoft YaHei,PingFang SC,sans-serif;fill:#17324d}.meta{font:15px Microsoft YaHei,PingFang SC,sans-serif;fill:#3f5567}.edge{fill:none;stroke:#35556f;stroke-width:3;marker-end:url(#arrow)}</style></defs><rect width="1400" height="890" fill="#ffffff"/><rect x="40" y="30" width="1320" height="70" rx="16" fill="#17324d"/><text x="700" y="74" text-anchor="middle" class="title">L04 实践路线：按顺序操作，每一步都留下实际结果</text><rect x="170" y="140" width="410" height="120" rx="14" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="375" y="174" text-anchor="middle" class="step">1 准备本讲记录</text><text x="375" y="208" text-anchor="middle" class="meta">位置：PowerShell</text><text x="375" y="236" text-anchor="middle" class="meta">产出：lesson-04-submission</text><rect x="820" y="140" width="410" height="120" rx="14" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="1025" y="174" text-anchor="middle" class="step">2 调查 V0 缺口</text><text x="1025" y="208" text-anchor="middle" class="meta">位置：写作会话 + 你</text><text x="1025" y="236" text-anchor="middle" class="meta">产出：Ticket A 合同</text><rect x="170" y="320" width="410" height="120" rx="14" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="375" y="354" text-anchor="middle" class="step">3 补齐并自查 V0</text><text x="375" y="388" text-anchor="middle" class="meta">位置：练习仓库</text><text x="375" y="416" text-anchor="middle" class="meta">产出：范围内 Diff</text><rect x="820" y="320" width="410" height="120" rx="14" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="1025" y="354" text-anchor="middle" class="step">4 独立接受 A</text><text x="1025" y="388" text-anchor="middle" class="meta">位置：非执行者</text><text x="1025" y="416" text-anchor="middle" class="meta">产出：A 接受记录</text><rect x="170" y="500" width="410" height="120" rx="14" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="375" y="534" text-anchor="middle" class="step">5 冻结并提交 B</text><text x="375" y="568" text-anchor="middle" class="meta">位置：控制工作台</text><text x="375" y="596" text-anchor="middle" class="meta">产出：任务与候选</text><rect x="820" y="500" width="410" height="120" rx="14" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="1025" y="534" text-anchor="middle" class="step">6 独立复验库存导出</text><text x="1025" y="568" text-anchor="middle" class="meta">位置：候选目录</text><text x="1025" y="596" text-anchor="middle" class="meta">产出：CSV 与报告</text><rect x="170" y="680" width="410" height="120" rx="14" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="375" y="714" text-anchor="middle" class="step">7 接受或打回</text><text x="375" y="748" text-anchor="middle" class="meta">位置：审核者</text><text x="375" y="776" text-anchor="middle" class="meta">产出：handoff.md</text><path class="edge" d="M580 200 H810"/><path class="edge" d="M1025 260 V290 H375 V310"/><path class="edge" d="M580 380 H810"/><path class="edge" d="M1025 440 V470 H375 V490"/><path class="edge" d="M580 560 H810"/><path class="edge" d="M1025 620 V650 H375 V670"/></svg>
