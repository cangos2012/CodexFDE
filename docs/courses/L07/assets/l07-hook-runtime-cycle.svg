<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1320" viewBox="0 0 1100 1320" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">事件与质量检查因果</title>
  <desc id="diagram-desc">L07 实践操作手册第 6 节教学示意；非软件截图。</desc>
  <defs>
    <marker id="grey" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6A7A8C" />
    </marker>
    <marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#B85450" />
    </marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#82B366" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="1320" fill="#FFFFFF" />
  <polyline points="550,270 550,330" fill="none" stroke="#6A7A8C" stroke-width="3" stroke-linejoin="round" marker-end="url(#grey)" />
  <polyline points="550,440 550,500" fill="none" stroke="#6A7A8C" stroke-width="3" stroke-linejoin="round" marker-end="url(#grey)" />
  <polyline points="550,610 550,670" fill="none" stroke="#6A7A8C" stroke-width="3" stroke-linejoin="round" marker-end="url(#grey)" />
  <polyline points="380,780 380,830 295,830 295,900" fill="none" stroke="#B85450" stroke-width="3" stroke-linejoin="round" marker-end="url(#red)" />
  <text x="110" y="850" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#B85450" dominant-baseline="text-before-edge">退出码非 0</text>
  <polyline points="720,780 720,830 805,830 805,900" fill="none" stroke="#82B366" stroke-width="3" stroke-linejoin="round" marker-end="url(#green)" />
  <text x="850" y="850" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#82B366" dominant-baseline="text-before-edge">退出码为 0</text>
  <rect x="40" y="30" width="1020" height="80" rx="12" fill="#17324D" stroke="#17324D" stroke-width="2" />
  <text x="65" y="50" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" dominant-baseline="text-before-edge">L07｜真实 Stop 事件怎样变成质量护栏</text>
  <rect x="240" y="180" width="620" height="90" rx="12" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="2" />
  <text x="265" y="200" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#20354A" dominant-baseline="text-before-edge">Codex 准备结束当前轮次</text>
  <text x="265" y="238" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#20354A" dominant-baseline="text-before-edge">事件：Stop</text>
  <rect x="170" y="330" width="760" height="110" rx="12" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="2" />
  <text x="195" y="350" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#20354A" dominant-baseline="text-before-edge">匹配已加载的项目 Stop 规则</text>
  <text x="195" y="388" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#20354A" dominant-baseline="text-before-edge">前提：该候选的项目 Hook 已审查并信任</text>
  <rect x="170" y="500" width="760" height="110" rx="12" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="2" />
  <text x="195" y="520" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#20354A" dominant-baseline="text-before-edge">启动 .codex/hooks/quality_gate.py</text>
  <text x="195" y="558" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#20354A" dominant-baseline="text-before-edge">位置：处理器归属的同一候选目录</text>
  <rect x="170" y="670" width="760" height="110" rx="12" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="2" />
  <text x="195" y="690" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#20354A" dominant-baseline="text-before-edge">用同候选解释器运行统一检查</text>
  <text x="195" y="728" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#20354A" dominant-baseline="text-before-edge">python -X utf8 -m eval.harness --suite blocking</text>
  <rect x="70" y="900" width="450" height="130" rx="12" fill="#F8CECC" stroke="#B85450" stroke-width="2" />
  <text x="95" y="920" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#20354A" dominant-baseline="text-before-edge">失败：decision: block</text>
  <text x="95" y="958" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#20354A" dominant-baseline="text-before-edge">将原因返回 Codex</text>
  <text x="95" y="990" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#20354A" dominant-baseline="text-before-edge">Codex 收到续跑原因；按原授权继续</text>
  <rect x="580" y="900" width="450" height="130" rx="12" fill="#D5E8D4" stroke="#82B366" stroke-width="2" />
  <text x="605" y="920" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#20354A" dominant-baseline="text-before-edge">成功：continue: true</text>
  <text x="605" y="958" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#20354A" dominant-baseline="text-before-edge">允许本轮结束</text>
  <text x="605" y="990" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#20354A" dominant-baseline="text-before-edge">保留实际报告与候选来源</text>
  <rect x="70" y="1110" width="960" height="130" rx="12" fill="#FFE6CC" stroke="#D79B00" stroke-width="2" />
  <text x="95" y="1130" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#20354A" dominant-baseline="text-before-edge">重入跳过不等于修复</text>
  <text x="95" y="1168" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#20354A" dominant-baseline="text-before-edge">stop_hook_active=true 时，参考实现跳过检查。</text>
  <text x="95" y="1200" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#20354A" dominant-baseline="text-before-edge">先显式复验，再取得新一轮正常 Stop 的通过记录。</text>
  <text x="100" y="130" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#49647E" dominant-baseline="text-before-edge">教学示意 · 配置决定怎么启动，检查结果决定怎样结束</text>
  <text x="80" y="1050" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#49647E" dominant-baseline="text-before-edge">失败返回后，修复与显式复验发生在同一候选中。</text>
  <rect x="100" y="1275" width="25" height="20" rx="4" fill="#DAE8FC" stroke="#6C8EBF" />
  <text x="135" y="1270" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#49647E" dominant-baseline="text-before-edge">运行链路</text>
  <rect x="330" y="1275" width="25" height="20" rx="4" fill="#FFE6CC" stroke="#D79B00" />
  <text x="365" y="1270" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#49647E" dominant-baseline="text-before-edge">重入注意</text>
  <rect x="560" y="1275" width="25" height="20" rx="4" fill="#F8CECC" stroke="#B85450" />
  <text x="595" y="1270" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#49647E" dominant-baseline="text-before-edge">阻断续跑</text>
  <rect x="790" y="1275" width="25" height="20" rx="4" fill="#D5E8D4" stroke="#82B366" />
  <text x="825" y="1270" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#49647E" dominant-baseline="text-before-edge">检查通过</text>
</svg>