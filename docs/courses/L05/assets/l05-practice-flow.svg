<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="890" viewBox="0 0 1400 890"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#35556f"/></marker><style>.title{font:700 26px Microsoft YaHei,PingFang SC,sans-serif;fill:#fff}.step{font:700 18px Microsoft YaHei,PingFang SC,sans-serif;fill:#17324d}.meta{font:15px Microsoft YaHei,PingFang SC,sans-serif;fill:#3f5567}.edge{fill:none;stroke:#35556f;stroke-width:3;marker-end:url(#arrow)}</style></defs><rect width="1400" height="890" fill="#ffffff"/><rect x="40" y="30" width="1320" height="70" rx="16" fill="#17324d"/><text x="700" y="74" text-anchor="middle" class="title">L05 实践路线：按顺序操作，每一步都留下实际结果</text><rect x="170" y="140" width="410" height="120" rx="14" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="375" y="174" text-anchor="middle" class="step">1 进入自己的工作台</text><text x="375" y="208" text-anchor="middle" class="meta">位置：控制仓库</text><text x="375" y="236" text-anchor="middle" class="meta">产出：L05 会话</text><rect x="820" y="140" width="410" height="120" rx="14" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="1025" y="174" text-anchor="middle" class="step">2 找出现有绿灯盲区</text><text x="1025" y="208" text-anchor="middle" class="meta">位置：你 + Codex</text><text x="1025" y="236" text-anchor="middle" class="meta">产出：首次判断</text><rect x="170" y="320" width="410" height="120" rx="14" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="375" y="354" text-anchor="middle" class="step">3 完成旧绿、新红对照</text><text x="375" y="388" text-anchor="middle" class="meta">位置：缺陷副本</text><text x="375" y="416" text-anchor="middle" class="meta">产出：两次稳定红灯</text><rect x="820" y="320" width="410" height="120" rx="14" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="1025" y="354" text-anchor="middle" class="step">4 验证工程范围</text><text x="1025" y="388" text-anchor="middle" class="meta">位置：独立练习仓库</text><text x="1025" y="416" text-anchor="middle" class="meta">产出：范围证据</text><rect x="170" y="500" width="410" height="120" rx="14" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="375" y="534" text-anchor="middle" class="step">5 把检查接入正式候选</text><text x="375" y="568" text-anchor="middle" class="meta">位置：控制工作台</text><text x="375" y="596" text-anchor="middle" class="meta">产出：冻结检查</text><rect x="820" y="500" width="410" height="120" rx="14" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="1025" y="534" text-anchor="middle" class="step">6 修复并复验</text><text x="1025" y="568" text-anchor="middle" class="meta">位置：正式候选</text><text x="1025" y="596" text-anchor="middle" class="meta">产出：红转绿证据</text><rect x="170" y="680" width="410" height="120" rx="14" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="375" y="714" text-anchor="middle" class="step">7 交给人判断</text><text x="375" y="748" text-anchor="middle" class="meta">位置：工作台页面</text><text x="375" y="776" text-anchor="middle" class="meta">产出：接受或返工</text><rect x="820" y="680" width="410" height="120" rx="14" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="1025" y="714" text-anchor="middle" class="step">8 排错与迁移</text><text x="1025" y="748" text-anchor="middle" class="meta">位置：你</text><text x="1025" y="776" text-anchor="middle" class="meta">产出：迁移结论</text><path class="edge" d="M580 200 H810"/><path class="edge" d="M1025 260 V290 H375 V310"/><path class="edge" d="M580 380 H810"/><path class="edge" d="M1025 440 V470 H375 V490"/><path class="edge" d="M580 560 H810"/><path class="edge" d="M1025 620 V650 H375 V670"/><path class="edge" d="M580 740 H810"/></svg>
