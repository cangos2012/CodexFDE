name: Workbench Eval Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  blocking-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLOWERP_PROJECT_ROOT: ${{ github.workspace }}/.runtime/flowerp-project
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workbench
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Check workbench installation
        run: python -X utf8 -m workbench.cli environment-check

      # Course integration tests read customer source. Pin it so a product update
      # cannot silently change this repository's regression baseline.
      - name: Checkout independent FlowERP test baseline
        uses: actions/checkout@v4
        with:
          repository: congde/flowERP
          ref: e0088d3a11ae68b7e23c2c6986167b87768d909e
          path: .runtime/flowerp-project
          persist-credentials: false
      - name: Install and check independent customer environment
        run: |
          python -m venv "$FLOWERP_PROJECT_ROOT/.venv"
          "$FLOWERP_PROJECT_ROOT/.venv/bin/python" -m pip install -e "$FLOWERP_PROJECT_ROOT"
          python -X utf8 -m workbench.cli environment-check --product
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Local course experiments
        if: ${{ !cancelled() }}
        run: python -B -X utf8 scripts/audit_course_experiments.py --output-dir .runtime/course-experiments-ci
      - name: Upload course experiment process evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-experiment-process-evidence
          path: .runtime/course-experiments-ci/*.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Browser state tests
        if: ${{ !cancelled() }}
        run: node --test tests/*.test.cjs
      - name: Unified blocking gate
        if: ${{ !cancelled() }}
        run: python -X utf8 -m eval.harness --suite blocking
      - name: Bind Evidence Envelope to this run
        if: always()
        run: python -X utf8 -m workbench.ci_evidence --report .runtime/reports/harness-blocking.json --output .runtime/reports/ci-evidence.json
      - name: Upload machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flowerp-harness-report
          path: |
            .runtime/reports/harness-blocking.json
            .runtime/reports/ci-evidence.json
          if-no-files-found: error
          include-hidden-files: true
